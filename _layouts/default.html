<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} | {% endif %}Yang Lin</title>
  <meta
    name="description"
    content="{{ page.description | default: site.description }}"
  />
  <link rel="stylesheet" href="/style.css" />
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        renderActions: {
          find_script_mathtex: [10, function (doc) {
            for (const node of document.querySelectorAll('script[type^="math/tex"]')) {
              const display = !!node.type.match(/; *mode=display/);
              const math = new doc.options.MathItem(node.textContent, doc.inputJax[0], display);
              const text = document.createTextNode('');
              node.parentNode.insertBefore(text, node);
              math.start = {node: text, delim: '', n: 0};
              math.end = {node: text, delim: '', n: 0};
              doc.math.push(math);
              node.parentNode.removeChild(node);
            }
          }, '']
        }
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="/index.html#hero">Yang Lin</a>
      <nav>
        <a class="nav-link{% if page.url == '/' or page.url == '/index.html' %} active{% endif %}" href="/index.html#about">About</a>
        <a class="nav-link{% if page.url == '/projects/' %} active{% endif %}" href="/projects/">Projects</a>
        <a class="nav-link{% if page.url == '/writing/' or page.layout == 'post' %} active{% endif %}" href="/writing/">Writing</a>
        <a class="nav-link" href="/index.html#contact">Contact</a>
      </nav>
      <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <p>© 2026 Yang Lin</p>
      <p>Built with GitHub Pages</p>
    </div>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
